name: Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../opportunity-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-scanner-apk
          path: mobile/opportunity-scanner.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Opportunity Scanner (Android)
          make_latest: true
          body: |
            APK de Android. Al abrirla, introduce la URL HTTPS de tu servidor donde está desplegada la app.
            Instalación: descarga el .apk en el móvil y permite "instalar apps de origen desconocido".
          files: mobile/opportunity-scanner.apk
