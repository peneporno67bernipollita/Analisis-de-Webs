<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opportunity Scanner</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:#f8fafc; color:#0f172a;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { width:100%; max-width:420px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:24px; }
  .logo { width:44px; height:44px; border-radius:12px; background:#4f46e5; color:#fff; font-weight:800;
          display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:12px; }
  h1 { font-size:18px; margin:0 0 4px; } p { color:#64748b; font-size:14px; margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; padding:12px; border:1px solid #cbd5e1; border-radius:10px; font-size:16px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px; font-size:16px; font-weight:600;
           background:#4f46e5; color:#fff; } .secondary { background:#fff; color:#475569; border:1px solid #cbd5e1; }
  .err { color:#b91c1c; font-size:13px; margin-top:8px; min-height:1em; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">B</div>
  <h1>Opportunity Scanner</h1>
  <div id="setup">
    <p>Introduce la dirección de tu servidor (donde está desplegada la app), por ejemplo https://oportunidades.tudominio.es</p>
    <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://…">
    <button id="save">Conectar</button>
    <div class="err" id="err"></div>
  </div>
  <div id="opening" style="display:none">
    <p>Abriendo <strong id="target"></strong>…</p>
    <button class="secondary" id="change">Cambiar servidor</button>
  </div>
</div>
<script>
  var KEY = "bos_server_url";
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  function go(u) { window.location.href = u; }
  function normalize(v) {
    v = (v || "").trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try { var u = new URL(v); return u.origin + "/"; } catch (e) { return null; }
  }
  if (saved) {
    document.getElementById("setup").style.display = "none";
    document.getElementById("opening").style.display = "block";
    document.getElementById("target").textContent = saved;
    var t = setTimeout(function () { go(saved); }, 1500);
    document.getElementById("change").onclick = function () {
      clearTimeout(t);
      document.getElementById("opening").style.display = "none";
      document.getElementById("setup").style.display = "block";
      document.getElementById("url").value = saved;
    };
  }
  document.getElementById("save").onclick = function () {
    var u = normalize(document.getElementById("url").value);
    if (!u) { document.getElementById("err").textContent = "Dirección no válida"; return; }
    try { localStorage.setItem(KEY, u); } catch (e) {}
    go(u);
  };
</script>
</body>
</html>
